# 패키지 기본 정보
[package]
name = robot
version = 0.0.1
description = Robot ROS 2 Package
maintainer = Your Name
maintainer_email = your@email.com
license = Apache-2.0

# 개발 모드와 설치 모드의 스크립트 설치 경로를 지정
# - colcon build 시 내부적으로 개발 모드와 설치 모드의 스크립트 설치 경로를 사용
# - $base: <project>/install/robot
[develop]
script_dir=$base/lib/robot

[install]
install_scripts=$base/lib/robot
