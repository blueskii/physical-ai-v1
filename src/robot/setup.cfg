# 빌드 모드별 스크립트 설치 경로를 지정
# - $base: <project>/install/robot

# 심볼릭 링크 빌드 (소스 직접 참조)
[develop]
script_dir=$base/lib/robot

# 일반 빌드
[install]
install_scripts=$base/lib/robot

#       --------------------------------  -------------------
# 	    심볼릭 링크 빌드	                   일반 빌드
#       --------------------------------  -------------------
# 명령|	 colcon build --symlink-install    colcon build
# 언제|	 개발 중	배포/운영 시
# 장점|	 Python 파일 수정 후 재빌드 불필요    설치 폴더가 완전히 독립적
# 단점|	 소스 폴더가 없어지면 실행 불가	       수정할 때마다 재빌드 필요
